[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-multi-agent-coordinator"
version = "0.1.0"
description = "Independent Microsoft Agent Framework coordinator service for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "agent-framework-core>=1.15,<1.16",
  "agent-framework-openai>=1.14,<1.15",
  "agent-framework-orchestrations>=1.1,<1.2",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "mcp>=1.24,<2",
]

[dependency-groups]
dev = [
  "basedpyright>=1.34,<2",
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
misaka-coordinator-baseline = "misaka_coordinator_service.baseline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_coordinator_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
