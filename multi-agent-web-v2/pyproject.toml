[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-multi-agent-web-v2"
version = "0.1.0"
description = "Same-origin LAN console and stream BFF for Multi-Agent Platform V2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.141,<1",
  "httpx2>=2.9,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.52,<1",
  "watchfiles>=1.1,<2",
]

[project.scripts]
multi-agent-web-v2 = "multi_agent_web_v2.main:run"
multi-agent-web-v2-dev = "multi_agent_web_v2.dev:run"

[dependency-groups]
dev = [
  "basedpyright>=1.34,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-timeout>=2,<3",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["multi_agent_web_v2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --timeout=30 --basetemp=.venv/pytest-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.basedpyright]
include = ["multi_agent_web_v2", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
