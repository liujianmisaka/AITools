[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-multi-agent-v2"
version = "0.1.0"
description = "Local-first durable orchestration control plane for coding agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cloudevents>=1.11,<2",
  "fastapi>=0.141,<1",
  "httpx2>=2.9,<3",
  "jmespath>=1,<2",
  "jsonschema>=4.25,<5",
  "networkx>=3.5,<4",
  "openai-codex>=0.144.4,<0.145",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "psutil>=7,<8",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.51,<2.1",
  "structlog>=25,<27",
  "temporalio[pydantic]>=1.27,<2",
  "uvicorn[standard]>=0.52,<1",
]

[project.scripts]
multi-agent-v2-api = "multi_agent_v2.apps.control_api.main:run"
multi-agent-v2-agent-worker = "multi_agent_v2.workers.agent_windows:run"
multi-agent-v2-preflight = "multi_agent_v2.apps.preflight:run"

[dependency-groups]
dev = [
  "basedpyright>=1.34,<2",
  "hypothesis>=6,<7",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7,<8",
  "pytest-timeout>=2,<3",
  "ruff>=0.14,<1",
  "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_v2"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --timeout=30 --basetemp=.venv/pytest-tmp"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires explicitly started local Temporal and PostgreSQL services"]

[tool.coverage.run]
branch = true
source = ["multi_agent_v2"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.basedpyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
