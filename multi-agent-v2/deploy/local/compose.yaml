name: multi-agent-v2

services:
  postgresql:
    image: postgres:16.15
    environment:
      MULTI_AGENT_V2_CONTROL_DB_PASSWORD: ${MULTI_AGENT_V2_CONTROL_DB_PASSWORD:?set in environment}
      MULTI_AGENT_V2_TEMPORAL_DB_PASSWORD: ${MULTI_AGENT_V2_TEMPORAL_DB_PASSWORD:?set in environment}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${MULTI_AGENT_V2_POSTGRES_ADMIN_PASSWORD:?set in environment}
      POSTGRES_USER: bootstrap_admin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB_PORT: 5432
      POSTGRES_PWD: ${MULTI_AGENT_V2_TEMPORAL_DB_PASSWORD:?set in environment}
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: temporal_runtime
      SQL_PASSWORD: ${MULTI_AGENT_V2_TEMPORAL_DB_PASSWORD:?set in environment}
    volumes:
      - ./temporal-setup:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh
    restart: on-failure:5

  temporal:
    image: temporalio/server:1.31.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      BIND_ON_IP: 0.0.0.0
      DB: postgres12
      DB_PORT: 5432
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      POSTGRES_PWD: ${MULTI_AGENT_V2_TEMPORAL_DB_PASSWORD:?set in environment}
      POSTGRES_SEEDS: postgresql
      POSTGRES_USER: temporal_runtime
    ports:
      - "127.0.0.1:7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 3s
      timeout: 3s
      start_period: 15s
      retries: 40
    restart: unless-stopped

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      DEFAULT_NAMESPACE: default
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ./temporal-setup:/scripts:ro
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh
    restart: on-failure:5

volumes:
  postgresql-data:
