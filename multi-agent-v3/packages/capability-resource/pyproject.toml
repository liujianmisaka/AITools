[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-resource-capability"
version = "0.1.0"
description = "In-memory lease, sandbox, credential and settings providers for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-capability-catalog==0.1.0",
  "misaka-composition-kernel==0.1.0",
  "misaka-interaction-contracts==0.1.0",
  "misaka-resource-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_resource_capability"]
