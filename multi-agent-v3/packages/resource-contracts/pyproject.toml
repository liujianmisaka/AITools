[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-resource-contracts"
version = "0.1.0"
description = "Lease, sandbox, credential and settings contracts for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-interaction-contracts==0.1.0",
  "misaka-kernel-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_resource_contracts"]
