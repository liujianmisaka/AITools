[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-fake-agent"
version = "0.1.0"
description = "Deterministic Fake Agent Provider for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-agent-capability==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_fake_agent"]
