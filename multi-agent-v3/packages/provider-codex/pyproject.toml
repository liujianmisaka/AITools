[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-codex-provider"
version = "0.1.0"
description = "Codex SDK Agent Provider for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-agent-capability==0.1.0",
  "misaka-composition-kernel==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
  "misaka-kernel-contracts==0.1.0",
  "misaka-session-capability==0.1.0",
  "openai-codex>=0.144.4,<0.145",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_codex_provider"]
