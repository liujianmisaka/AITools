[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-coordinator-workflow"
version = "0.1.0"
description = "Optional DAG and state-machine coordinator for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-coordinator-runtime==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_coordinator_workflow"]
