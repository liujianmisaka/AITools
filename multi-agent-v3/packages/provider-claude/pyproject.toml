[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-claude-provider"
version = "0.1.0"
description = "Claude Agent SDK Provider for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk>=0.2.144,<0.3",
  "misaka-agent-capability==0.1.0",
  "misaka-composition-kernel==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
  "misaka-kernel-contracts==0.1.0",
  "misaka-session-capability==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_claude_provider"]
