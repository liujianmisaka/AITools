[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-interaction-jsonl"
version = "0.1.0"
description = "Durable JSONL interaction channel provider for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-interaction-capability==0.1.0",
  "misaka-interaction-contracts==0.1.0",
  "misaka-memory-interaction==0.1.0",
  "misaka-persistence-contracts==0.1.0",
  "misaka-persistence-jsonl==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_interaction_jsonl"]
