[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-event-source-runtime"
version = "0.1.0"
description = "Provider-neutral Webhook, Git, Timer and Cron event sources for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "croniter>=6,<7",
  "misaka-kernel-contracts==0.1.0",
  "tzdata>=2025,<2027",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_event_source"]
