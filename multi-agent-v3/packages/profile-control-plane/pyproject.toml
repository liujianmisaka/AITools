[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-profile-control-plane"
version = "0.1.0"
description = "Local FastAPI control-plane profile for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "misaka-approval-capability==0.1.0",
  "misaka-approval-persistence-jsonl==0.1.0",
  "misaka-coordinator-runtime==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
  "misaka-persistence-contracts==0.1.0",
  "misaka-persistence-jsonl==0.1.0",
  "misaka-service-runtime==0.1.0",
  "uvicorn[standard]>=0.35,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_control_plane"]
