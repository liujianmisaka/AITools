[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-coordinator-temporal"
version = "0.1.0"
description = "Temporal durable invocation coordinator for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-coordinator-runtime==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
  "temporalio>=1.30,<1.31",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_coordinator_temporal"]
