[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-policy-capability"
version = "0.1.0"
description = "Policy capability seam for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-composition-kernel==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
  "misaka-kernel-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_policy_capability"]
