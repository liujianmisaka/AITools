[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-agent-host-profile"
version = "0.1.0"
description = "Standalone Agent Host profile for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-agent-capability==0.1.0",
  "misaka-artifact-capability==0.1.0",
  "misaka-composition-kernel==0.1.0",
  "misaka-fake-agent==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
  "misaka-policy-capability==0.1.0",
  "misaka-process-capability==0.1.0",
  "misaka-session-capability==0.1.0",
  "misaka-workspace-capability==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_agent_host_profile"]
