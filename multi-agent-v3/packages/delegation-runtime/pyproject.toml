[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-delegation-runtime"
version = "0.1.0"
description = "Local provider-neutral delegation runtime for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-delegation-capability==0.1.0",
  "misaka-delegation-contracts==0.1.0",
  "misaka-interaction-capability==0.1.0",
  "misaka-interaction-contracts==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-invocation-runtime==0.1.0",
  "misaka-kernel-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_delegation_runtime"]
