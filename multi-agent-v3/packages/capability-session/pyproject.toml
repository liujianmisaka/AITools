[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-session-capability"
version = "0.1.0"
description = "Session capability seam and memory provider for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-composition-kernel==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-kernel-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_session_capability"]
