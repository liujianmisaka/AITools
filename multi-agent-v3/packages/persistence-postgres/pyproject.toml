[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-persistence-postgres"
version = "0.1.0"
description = "PostgreSQL durable event and job store for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.31,<1",
  "misaka-kernel-contracts==0.1.0",
  "misaka-persistence-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_persistence_postgres"]
