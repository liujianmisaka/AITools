[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-persistence-jsonl"
version = "0.1.0"
description = "Durable JSONL event log and job registry for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "misaka-kernel-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_persistence_jsonl"]
