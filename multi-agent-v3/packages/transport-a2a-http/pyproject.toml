[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "misaka-a2a-http-transport"
version = "0.1.0"
description = "Official A2A SDK HTTP, JSON-RPC and SSE transport for Multi-Agent V3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server]>=1.1.2,<1.2",
  "misaka-a2a-capability==0.1.0",
  "misaka-a2a-runtime==0.1.0",
  "misaka-invocation-contracts==0.1.0",
  "misaka-kernel-contracts==0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/misaka_a2a_http"]
