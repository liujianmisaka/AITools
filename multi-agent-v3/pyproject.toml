[project]
name = "misaka-multi-agent-v3-workspace"
version = "0.1.0"
description = "Capability-first multi-agent platform V3 workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright>=1.34,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-timeout>=2,<3",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
misaka-kernel-contracts = { workspace = true }
misaka-composition-kernel = { workspace = true }
misaka-invocation-contracts = { workspace = true }
misaka-invocation-runtime = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --timeout=30"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "packages/kernel-contracts/src",
  "packages/invocation-contracts/src",
  "packages/kernel/src",
  "packages/invocation-runtime/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.basedpyright]
include = ["packages", "tests", "tools"]
extraPaths = [
  "packages/kernel-contracts/src",
  "packages/invocation-contracts/src",
  "packages/kernel/src",
  "packages/invocation-runtime/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
