[project]
name = "misaka-multi-agent-v3-workspace"
version = "0.1.0"
description = "Capability-first multi-agent platform V3 workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "a2a-sdk[http-server]>=1.1.2,<1.2",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.31,<0.32",
  "basedpyright>=1.34,<2",
  "httpx2>=2.9,<3",
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "pytest-timeout>=2,<3",
  "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
misaka-kernel-contracts = { workspace = true }
misaka-composition-kernel = { workspace = true }
misaka-invocation-contracts = { workspace = true }
misaka-invocation-runtime = { workspace = true }
misaka-agent-capability = { workspace = true }
misaka-fake-agent = { workspace = true }
misaka-agent-host-profile = { workspace = true }
misaka-policy-capability = { workspace = true }
misaka-artifact-capability = { workspace = true }
misaka-session-capability = { workspace = true }
misaka-process-capability = { workspace = true }
misaka-workspace-capability = { workspace = true }
misaka-codex-provider = { workspace = true }
misaka-a2a-capability = { workspace = true }
misaka-a2a-runtime = { workspace = true }
misaka-a2a-http-transport = { workspace = true }
misaka-a2a-node-profile = { workspace = true }
misaka-coordinator-runtime = { workspace = true }
misaka-coordinator-temporal = { workspace = true }
misaka-coordinator-workflow = { workspace = true }
misaka-profile-control-plane = { workspace = true }
misaka-profile-control-plane-workflow = { workspace = true }
misaka-event-source-runtime = { workspace = true }
misaka-persistence-contracts = { workspace = true }
misaka-persistence-jsonl = { workspace = true }
misaka-persistence-postgres = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --timeout=30"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [
  "packages/kernel-contracts/src",
  "packages/invocation-contracts/src",
  "packages/kernel/src",
  "packages/invocation-runtime/src",
  "packages/capability-agent/src",
  "packages/provider-fake/src",
  "packages/profile-agent-host/src",
  "packages/capability-policy/src",
  "packages/capability-artifact/src",
  "packages/capability-session/src",
  "packages/capability-process/src",
  "packages/capability-workspace/src",
  "packages/provider-codex/src",
  "packages/capability-a2a/src",
  "packages/a2a-runtime/src",
  "packages/transport-a2a-http/src",
  "packages/profile-a2a-node/src",
  "packages/coordinator-runtime/src",
  "packages/coordinator-temporal/src",
  "packages/coordinator-workflow/src",
  "packages/profile-control-plane/src",
  "packages/profile-control-plane-workflow/src",
  "packages/event-source-runtime/src",
  "packages/persistence-contracts/src",
  "packages/persistence-jsonl/src",
  "packages/persistence-postgres/src",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.basedpyright]
include = ["examples", "packages", "tests", "tools"]
extraPaths = [
  "packages/kernel-contracts/src",
  "packages/invocation-contracts/src",
  "packages/kernel/src",
  "packages/invocation-runtime/src",
  "packages/capability-agent/src",
  "packages/provider-fake/src",
  "packages/profile-agent-host/src",
  "packages/capability-policy/src",
  "packages/capability-artifact/src",
  "packages/capability-session/src",
  "packages/capability-process/src",
  "packages/capability-workspace/src",
  "packages/provider-codex/src",
  "packages/capability-a2a/src",
  "packages/a2a-runtime/src",
  "packages/transport-a2a-http/src",
  "packages/profile-a2a-node/src",
  "packages/coordinator-runtime/src",
  "packages/coordinator-temporal/src",
  "packages/coordinator-workflow/src",
  "packages/profile-control-plane/src",
  "packages/profile-control-plane-workflow/src",
  "packages/event-source-runtime/src",
  "packages/persistence-contracts/src",
  "packages/persistence-jsonl/src",
  "packages/persistence-postgres/src",
]
pythonVersion = "3.12"
typeCheckingMode = "strict"
